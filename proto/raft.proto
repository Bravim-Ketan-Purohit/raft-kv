syntax = "proto3";

package raftkv;

option cc_generic_services = false;

// --- Peer RPC ---

message LogEntryProto {
    uint64 index = 1;
    uint64 term = 2;
    oneof command {
        PutCommandProto put = 3;
        DeleteCommandProto delete_cmd = 4;
        NoOpCommandProto noop = 5;
    }
}

message PutCommandProto {
    string key = 1;
    string value = 2;
}

message DeleteCommandProto {
    string key = 1;
}

message NoOpCommandProto {}

message VoteRequest {
    uint64 term = 1;
    uint32 candidate_id = 2;
    uint64 last_log_index = 3;
    uint64 last_log_term = 4;
}

message VoteReply {
    uint64 term = 1;
    bool vote_granted = 2;
}

message AppendRequest {
    uint64 term = 1;
    uint32 leader_id = 2;
    uint64 prev_log_index = 3;
    uint64 prev_log_term = 4;
    repeated LogEntryProto entries = 5;
    uint64 leader_commit = 6;
}

message AppendReply {
    uint64 term = 1;
    bool success = 2;
    uint64 match_index = 3;
    optional uint64 conflict_term = 4;
    optional uint64 conflict_index = 5;
}

service RaftPeer {
    rpc RequestVote(VoteRequest) returns (VoteReply);
    rpc AppendEntries(AppendRequest) returns (AppendReply);
}
