syntax = "proto3";

package raftkv;

option cc_generic_services = false;

enum ReadConsistency {
    LINEARIZABLE = 0;
    STALE_OK = 1;
}

message GetRequest {
    string key = 1;
    ReadConsistency consistency = 2;
}

message GetReply {
    bool found = 1;
    string value = 2;
    string leader_hint = 3;
    uint64 commit_index = 4;
    bool not_leader = 5;
}

message PutRequest {
    string key = 1;
    string value = 2;
}

message PutReply {
    bool success = 1;
    string leader_hint = 2;
    bool not_leader = 3;
}

message DeleteRequest {
    string key = 1;
}

message DeleteReply {
    bool success = 1;
    string leader_hint = 2;
    bool not_leader = 3;
}

message ScanRequest {
    string prefix = 1;
    uint32 max_results = 2;
    ReadConsistency consistency = 3;
}

message KeyValue {
    string key = 1;
    string value = 2;
}

service Kv {
    rpc Get(GetRequest) returns (GetReply);
    rpc Put(PutRequest) returns (PutReply);
    rpc Delete(DeleteRequest) returns (DeleteReply);
    rpc Scan(ScanRequest) returns (stream KeyValue);
}
