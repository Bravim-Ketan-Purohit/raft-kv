# Observability stack for RaftKV — OFF by default.
# Start with: docker compose -f docker-compose.observability.yml up -d
#
# Collector receives OTel gRPC on :7121, Jaeger UI on :7120.
# Nodes export traces via --otel-exporter=otlp to localhost:7121.

version: '3.8'

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    command: ["--config=/etc/otel-collector.yml"]
    ports:
      - "7121:4317"  # gRPC receiver
    volumes:
      - ./observability/otel-collector.yml:/etc/otel-collector.yml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.56
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "7120:16686"  # Jaeger UI
      - "4317"        # OTLP gRPC (internal, collector sends here)
